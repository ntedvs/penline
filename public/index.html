<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ebe8df" />
    <title>Penline</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Penline</h1>
        <div class="actions">
          <label class="button" for="image-input">Choose image</label>
          <input id="image-input" type="file" accept="image/*" />
          <button class="button button-primary" id="save-button" type="button">Save PNG</button>
        </div>
      </header>

      <section class="workspace">
        <div class="canvas-shell" id="drop-zone">
          <canvas id="artwork" width="1400" height="1400" aria-label="Penline artwork"></canvas>
          <div class="drop-message" id="drop-message">Drop image</div>
        </div>

        <aside>
          <div class="control">
            <div class="control-label">
              <label for="lines">Lines</label>
              <output for="lines" id="lines-value">80</output>
            </div>
            <input id="lines" type="range" min="20" max="240" value="80" />
          </div>

          <div class="control">
            <div class="control-label">
              <label for="weight">Weight</label>
              <output for="weight" id="weight-value">52</output>
            </div>
            <input id="weight" type="range" min="10" max="90" value="52" />
          </div>

          <div class="control">
            <div class="control-label">
              <label for="breakup">Breakup</label>
              <output for="breakup" id="breakup-value">58</output>
            </div>
            <input id="breakup" type="range" min="0" max="100" value="58" />
          </div>

          <div class="control">
            <div class="control-label">
              <label for="roughness">Roughness</label>
              <output for="roughness" id="roughness-value">46</output>
            </div>
            <input id="roughness" type="range" min="0" max="100" value="46" />
          </div>

          <button
            class="reset is-hidden"
            id="reset-button"
            type="button"
            disabled
            aria-hidden="true"
          >
            Reset
          </button>
        </aside>
      </section>
    </main>

    <script src="./app.js" defer></script>
  </body>
</html>
